<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8" />
    <title>UNLEASH THE DREAM — Display</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;600&family=Noto+Sans+JP:wght@400;500;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #08070d;
            --bg-2: #14101f;
            --ink: #f4f1f8;
            --ink-dim: #8d84a3;
            --pink: #ff3d81;
            --cyan: #34f5c5;
            --amber: #ffb238;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at 50% 110%, var(--bg-2) 0%, var(--bg) 60%);
            overflow: hidden;
            font-family: "Noto Sans JP", "Inter", sans-serif;
        }

        /* Ambient sweeping spotlight — background motion */
        .sweep {
            position: fixed;
            top: -20%;
            left: 50%;
            width: 140vmax;
            height: 140vmax;
            transform: translateX(-50%);
            background: conic-gradient(from 0deg,
                    transparent 0deg,
                    rgba(255, 61, 129, 0.05) 8deg,
                    transparent 20deg,
                    transparent 340deg);
            animation: rotate 22s linear infinite;
            pointer-events: none;
        }

        @keyframes rotate {
            from {
                transform: translateX(-50%) rotate(0deg);
            }

            to {
                transform: translateX(-50%) rotate(360deg);
            }
        }

        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 28px 40px;
            z-index: 10;
        }

        .brand {
            font-family: "Space Grotesk", sans-serif;
            font-weight: 700;
            font-size: 20px;
            letter-spacing: 0.02em;
            color: var(--ink);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--pink);
            box-shadow: 0 0 12px 2px var(--pink);
            animation: pulse 1.6s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }

            50% {
                opacity: 0.5;
                transform: scale(0.75);
            }
        }

        .qr-hint {
            font-size: 13px;
            color: var(--ink-dim);
            letter-spacing: 0.04em;
        }

        .stage {
            position: fixed;
            inset: 0;
        }

        .chip {
            position: absolute;
            bottom: -160px;
            font-family: "Space Grotesk", "Noto Sans JP", sans-serif;
            font-weight: 500;
            font-size: clamp(18px, 2.2vw, 28px);
            color: var(--ink);
            padding: 14px 24px;
            border-radius: 24px;
            max-width: min(460px, 30vw);
            white-space: normal;
            word-break: break-word;
            overflow-wrap: break-word;
            line-height: 1.45;
            text-align: center;
            background: rgba(20, 16, 31, 0.65);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            animation-name: rise, sway;
            animation-timing-function: linear, ease-in-out;
            animation-iteration-count: 1, infinite;
            will-change: transform, opacity;
        }

        @keyframes rise {
            0% {
                bottom: -160px;
                opacity: 0;
            }

            6% {
                opacity: 1;
            }

            88% {
                opacity: 1;
            }

            100% {
                bottom: 108vh;
                opacity: 0;
            }
        }

        @keyframes sway {

            0%,
            100% {
                margin-left: 0;
            }

            50% {
                margin-left: var(--sway, 14px);
            }
        }

        .empty-state {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 18px;
            color: var(--ink-dim);
            text-align: center;
            transition: opacity 0.6s ease;
        }

        .empty-state.hide {
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>

<body>

    <div class="sweep"></div>

    <header>
        <div class="brand"><span class="dot"></span>UNLEASH THE DREAM</div>
        <div class="qr-hint">QRを読み取ってメッセージを送ろう</div>
    </header>

    <div class="stage" id="stage"></div>

    <div class="empty-state" id="emptyState">
        <div>まだメッセージはありません</div>
        <div>QRコードを読み取って、最初の一言を送ってみよう</div>
    </div>

    <script>
        // Plain WebSocket — no Socket.io
        const wsProtocol = location.protocol === "https:" ? "wss:" : "ws:";
        const wsHost = location.host || "localhost:3000";
        const socket = new WebSocket(`${wsProtocol}//${wsHost}/ws`);

        function send(obj) {
            if (socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify(obj));
            }
        }

        const stage = document.getElementById("stage");
        const emptyState = document.getElementById("emptyState");

        const COLORS = [
            "#ff3d81", // ネオンピンク
            "#34f5c5", // エレクトリックシアン
            "#ffb238", // アンバーゴールド
            "#a855f7", // コズミックパープル
            "#38bdf8", // スカイブルー
            "#ff6b6b", // サンセットコーラル
            "#4ade80", // ライムエメラルド
            "#f5d061"  // シャンパンゴールド
        ];
        const MAX_ON_SCREEN = 40;
        let onScreen = 0;
        const seen = new Set();

        // ── 衝突回避型リアルタイム・ランダム位置決め ──────────────────
        function getRandomPositionLeft() {
            const activeChips = Array.from(stage.querySelectorAll('.chip'));
            const stageHeight = stage.clientHeight || window.innerHeight;
            const stageWidth = stage.clientWidth || window.innerWidth;

            // 画面下部（高さ280px以内）にある直近のチップの横位置(vw)を取得
            const bottomChipsX = activeChips.filter(chip => {
                const rect = chip.getBoundingClientRect();
                const distFromBottom = stageHeight - rect.bottom;
                return distFromBottom < 280;
            }).map(chip => {
                const rect = chip.getBoundingClientRect();
                return (rect.left / stageWidth) * 100;
            });

            // 画面全体（5vw〜70vw）から重ならない位置をランダム選択
            const MIN_CLEARANCE_VW = 18;
            let bestLeft = 5 + Math.random() * 65;
            let maxClearance = -1;

            for (let i = 0; i < 15; i++) {
                const candidateLeft = 5 + Math.random() * 65;
                if (bottomChipsX.length === 0) return candidateLeft;

                let minDist = Infinity;
                for (const x of bottomChipsX) {
                    const d = Math.abs(candidateLeft - x);
                    if (d < minDist) minDist = d;
                }

                if (minDist >= MIN_CLEARANCE_VW) {
                    return candidateLeft; // 被らないクリアランスがあれば即採用
                }

                if (minDist > maxClearance) {
                    maxClearance = minDist;
                    bestLeft = candidateLeft;
                }
            }

            return bestLeft;
        }

        // ── キュー管理 ──────────────────
        const messageQueue = [];
        let isProcessingQueue = false;

        function enqueueMessage(message) {
            if (!message) return;
            if (message.id) {
                if (seen.has(message.id)) return;
                seen.add(message.id);
            }
            messageQueue.push(message);
            processQueue();
        }

        function processQueue() {
            if (isProcessingQueue || messageQueue.length === 0) return;
            isProcessingQueue = true;

            const m = messageQueue.shift();
            spawnChip(m, nextColorIndex());

            // 混雑度に応じたナチュラルな発射間隔 (1.4秒〜2.0秒)
            const delay = messageQueue.length > 8 ? 1400 : 2000;
            setTimeout(() => {
                isProcessingQueue = false;
                processQueue();
            }, delay);
        }

        function colorFor(index) {
            return COLORS[index % COLORS.length];
        }

        function spawnChip(message, colorIndex) {
            emptyState.classList.add("hide");

            if (onScreen >= MAX_ON_SCREEN) {
                const oldest = stage.querySelector(".chip");
                if (oldest) oldest.remove();
                onScreen = Math.max(0, onScreen - 1);
            }

            const chip = document.createElement("div");
            chip.className = "chip";

            let rawText = (typeof message === "string" ? message : message.text) || "";
            if (rawText.length > 40) {
                rawText = rawText.slice(0, 40);
            }
            chip.textContent = rawText;

            const color = colorFor(colorIndex);
            chip.style.color = color;
            chip.style.boxShadow = `0 0 24px -6px ${color}88`;
            chip.style.borderColor = `${color}55`;

            // 完全ランダム＆衝突検知で位置を決定
            const left = getRandomPositionLeft();
            chip.style.left = `${left}vw`;

            // 自然な揺らぎを与える上昇スピードとスウェイ
            const duration = 15.5 + Math.random() * 2;
            const swayAmount = (Math.random() > 0.5 ? 1 : -1) * (10 + Math.random() * 16);
            chip.style.setProperty("--sway", `${swayAmount}px`);
            chip.style.animationDuration = `${duration}s, ${2.5 + Math.random()}s`;

            stage.appendChild(chip);
            onScreen += 1;

            chip.addEventListener("animationend", (e) => {
                if (e.animationName === "rise") {
                    chip.remove();
                    onScreen = Math.max(0, onScreen - 1);
                }
            });
        }

        let lastColorIndex = -1;
        function nextColorIndex() {
            let next;
            do {
                next = Math.floor(Math.random() * COLORS.length);
            } while (next === lastColorIndex && COLORS.length > 1);
            lastColorIndex = next;
            return next;
        }

        socket.addEventListener("open", () => {
            send({ type: "history" });
        });

        socket.addEventListener("message", (event) => {
            let data;
            try {
                data = JSON.parse(event.data);
            } catch {
                return;
            }

            if (data.type === "history" && Array.isArray(data.messages)) {
                data.messages.forEach((m) => enqueueMessage(m));
                return;
            }

            if (data.type === "message" && data.message) {
                enqueueMessage(data.message);
            }
        });
    </script>
</body>

</html>
