<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8" />
    <title>UNLEASH THE DREAM — Display</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;600&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #08070d;
            --bg-2: #14101f;
            --ink: #f4f1f8;
            --ink-dim: #8d84a3;
            --pink: #ff3d81;
            --cyan: #34f5c5;
            --amber: #ffb238;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at 50% 110%, var(--bg-2) 0%, var(--bg) 60%);
            overflow: hidden;
            font-family: "Inter", sans-serif;
        }

        /* Ambient sweeping spotlight — background motion */
        .sweep {
            position: fixed;
            top: -20%;
            left: 50%;
            width: 140vmax;
            height: 140vmax;
            transform: translateX(-50%);
            background: conic-gradient(from 0deg,
                    transparent 0deg,
                    rgba(255, 61, 129, 0.05) 8deg,
                    transparent 20deg,
                    transparent 340deg);
            animation: rotate 22s linear infinite;
            pointer-events: none;
        }

        @keyframes rotate {
            from {
                transform: translateX(-50%) rotate(0deg);
            }

            to {
                transform: translateX(-50%) rotate(360deg);
            }
        }

        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 28px 40px;
            z-index: 10;
        }

        .brand {
            font-family: "Space Grotesk", sans-serif;
            font-weight: 700;
            font-size: 20px;
            letter-spacing: 0.02em;
            color: var(--ink);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--pink);
            box-shadow: 0 0 12px 2px var(--pink);
            animation: pulse 1.6s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }

            50% {
                opacity: 0.5;
                transform: scale(0.75);
            }
        }

        .qr-hint {
            font-size: 13px;
            color: var(--ink-dim);
            letter-spacing: 0.04em;
        }

        .stage {
            position: fixed;
            inset: 0;
        }

        .chip {
            position: absolute;
            bottom: -140px;
            font-family: "Space Grotesk", sans-serif;
            font-weight: 500;
            font-size: clamp(20px, 2.6vw, 34px);
            color: var(--ink);
            padding: 16px 26px;
            border-radius: 999px;
            white-space: nowrap;
            background: rgba(20, 16, 31, 0.55);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            animation-name: rise, sway;
            animation-timing-function: linear, ease-in-out;
            animation-iteration-count: 1, infinite;
            will-change: transform, opacity;
        }

        @keyframes rise {
            0% {
                bottom: -140px;
                opacity: 0;
            }

            6% {
                opacity: 1;
            }

            88% {
                opacity: 1;
            }

            100% {
                bottom: 108vh;
                opacity: 0;
            }
        }

        @keyframes sway {

            0%,
            100% {
                margin-left: 0;
            }

            50% {
                margin-left: var(--sway, 12px);
            }
        }

        .empty-state {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 18px;
            color: var(--ink-dim);
            text-align: center;
            transition: opacity 0.6s ease;
        }

        .empty-state .big {
            font-family: "Space Grotesk", sans-serif;
            font-weight: 700;
            font-size: clamp(28px, 4vw, 48px);
            color: var(--ink);
            letter-spacing: 0.01em;
        }

        .empty-state.hide {
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>

<body>

    <div class="sweep"></div>

    <header>
        <div class="brand"><span class="dot"></span>UNLEASH THE DREAM</div>
        <div class="qr-hint">QRを読み取ってメッセージを送ろう</div>
    </header>

    <div class="stage" id="stage"></div>

    <div class="empty-state" id="emptyState">
        <div>まだメッセージはありません</div>
        <div>QRコードを読み取って、最初の一言を送ってみよう</div>
    </div>

    <script>
        // Plain WebSocket — no Socket.io
        const wsProtocol = location.protocol === "https:" ? "wss:" : "ws:";
        const wsHost = location.host || "localhost:3000";
        const socket = new WebSocket(`${wsProtocol}//${wsHost}/ws`);

        function send(obj) {
            if (socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify(obj));
            }
        }

        const stage = document.getElementById("stage");
        const emptyState = document.getElementById("emptyState");

        const COLORS = ["#ff3d81", "#34f5c5", "#ffb238"];
        const MAX_ON_SCREEN = 40;
        let onScreen = 0;
        const seen = new Set();

        // ── レーン（列）位置管理 (被りゼロの広め3レーン配置) ────────────────
        const LANES_LEFT_VW = [8, 38, 68]; // 左・中央・右の広め3レーン
        const laneLastUsed = new Array(LANES_LEFT_VW.length).fill(0);
        let lastLaneIndex = -1;

        function getOptimalLaneLeft() {
            const now = Date.now();
            let bestLane = 0;
            let maxElapsed = -1;

            // 直近で最も使われておらず、前回と重複しないレーンを選択
            for (let i = 0; i < LANES_LEFT_VW.length; i++) {
                if (i === lastLaneIndex && LANES_LEFT_VW.length > 1) continue;
                const elapsed = now - laneLastUsed[i];
                if (elapsed > maxElapsed) {
                    maxElapsed = elapsed;
                    bestLane = i;
                }
            }

            laneLastUsed[bestLane] = now;
            lastLaneIndex = bestLane;

            const baseLeft = LANES_LEFT_VW[bestLane];
            const jitter = (Math.random() - 0.5) * 6; // ±3vwの微ブレ
            return Math.min(75, Math.max(5, baseLeft + jitter));
        }

        // ── キュー管理 (垂直衝突防止の十分な間隔確保) ──────────────────
        const messageQueue = [];
        let isProcessingQueue = false;

        function enqueueMessage(message) {
            if (!message) return;
            if (message.id) {
                if (seen.has(message.id)) return;
                seen.add(message.id);
            }
            messageQueue.push(message);
            processQueue();
        }

        function processQueue() {
            if (isProcessingQueue || messageQueue.length === 0) return;
            isProcessingQueue = true;

            const m = messageQueue.shift();
            spawnChip(m, nextColorIndex());

            // 垂直方向の被りを防ぐため、最小1.8秒の間隔をあけて打ち上げ
            const delay = messageQueue.length > 8 ? 1400 : 2000;
            setTimeout(() => {
                isProcessingQueue = false;
                processQueue();
            }, delay);
        }

        function colorFor(index) {
            return COLORS[index % COLORS.length];
        }

        function spawnChip(message, colorIndex) {
            emptyState.classList.add("hide");

            if (onScreen >= MAX_ON_SCREEN) {
                const oldest = stage.querySelector(".chip");
                if (oldest) oldest.remove();
                onScreen = Math.max(0, onScreen - 1);
            }

            const chip = document.createElement("div");
            chip.className = "chip";
            chip.textContent = message.text || message;

            const color = colorFor(colorIndex);
            chip.style.color = color;
            chip.style.boxShadow = `0 0 24px -6px ${color}88`;
            chip.style.borderColor = `${color}55`;

            const left = getOptimalLaneLeft();
            chip.style.left = `${left}vw`;

            // 上昇速度を全員固定(16秒)にし、後発チップによる追突を防止
            const duration = 16;
            const swayAmount = (Math.random() > 0.5 ? 1 : -1) * 12; // 控えめな左右スウェイ(±12px)
            chip.style.setProperty("--sway", `${swayAmount}px`);
            chip.style.animationDuration = `${duration}s, 3s`;

            chip.addEventListener("animationend", (e) => {
                if (e.animationName === "rise") {
                    chip.remove();
                    onScreen = Math.max(0, onScreen - 1);
                }
            });

            stage.appendChild(chip);
            onScreen += 1;
        }

        let colorCursor = 0;
        function nextColorIndex() {
            colorCursor = (colorCursor + 1) % COLORS.length;
            return colorCursor;
        }

        socket.addEventListener("open", () => {
            send({ type: "history" });
        });

        socket.addEventListener("message", (event) => {
            let data;
            try {
                data = JSON.parse(event.data);
            } catch {
                return;
            }

            if (data.type === "history" && Array.isArray(data.messages)) {
                data.messages.forEach((m) => enqueueMessage(m));
                return;
            }

            if (data.type === "message" && data.message) {
                enqueueMessage(data.message);
            }
        });
    </script>
</body>

</html>
